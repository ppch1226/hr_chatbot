<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/pretendard/pretendard.css">
<link rel="stylesheet" href="/vendor/symbols/outlined.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/tailwind/index.global.js"></script>
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script src="/js/common.js"></script>

<title>KT IS 인사해삐 - 자주 찾는 질문 관리</title>
</head>
<body class="min-h-screen flex flex-col relative">
<main class="relative z-20 flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8 space-y-6">
  <!-- 두 카드는 같은 높이: 사내규정은 처음 4개만 보이고 나머지는 토글로 펼침 -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
    <div class="lg:col-span-6 bg-white rounded-2xl border border-slate-200/90 p-6 sm:p-7 shadow-sm flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-red-50 flex items-center justify-center text-[#E60012]"><span class="material-symbols-outlined text-[24px]">trending_up</span></div>
          <h2 class="font-bold text-slate-900 text-xl sm:text-2xl">실시간 인기 검색어</h2></div>
        <span class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-full">비식별 집계</span>
      </div>
      <div id="stats" class="mt-5 space-y-4"></div>
    </div>
    <div class="lg:col-span-6 bg-white rounded-2xl border border-slate-200/90 p-6 sm:p-7 shadow-sm flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-red-50 flex items-center justify-center text-[#E60012]"><span class="material-symbols-outlined text-[24px]">menu_book</span></div>
          <h2 class="font-bold text-slate-900 text-xl sm:text-2xl">사내규정 바로가기</h2></div>
        <span class="bg-slate-100 text-slate-600 border border-slate-200 px-3 py-1 rounded-full text-xs font-medium">최신 규정 적용</span>
      </div>
      <div id="regs" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mt-5"></div>
      <button id="regs-toggle" type="button" class="hidden mt-auto pt-4 w-full text-xs font-bold text-slate-600 hover:text-[#E60012] flex items-center justify-center gap-1"></button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm overflow-hidden">
    <div class="p-6 lg:p-7 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <h2 class="font-bold text-slate-900 flex items-center gap-2.5 text-[22px] sm:text-[26px]"><span class="material-symbols-outlined text-[#E60012] text-[28px]">format_list_bulleted</span>자주 찾는 질문 리스트 관리</h2>
      <div class="flex items-center gap-2.5">
        <div class="relative"><span class="material-symbols-outlined absolute left-3.5 top-2.5 text-slate-400 text-[20px]">search</span>
          <input id="kw" class="pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#E60012] w-56 sm:w-72" placeholder="질문 제목 또는 키워드 검색"></div>
        <select id="flt" class="py-2 px-3 rounded-xl border border-slate-200 text-sm bg-white"><option value="">전체 상태</option><option>대기</option><option>게시</option><option>반려</option></select>
        <button id="btn-new" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#E60012] hover:bg-[#B7000C] text-white text-sm font-bold shrink-0"><span class="material-symbols-outlined text-[18px]">add</span>FAQ 추가</button>
      </div>
    </div>
    <div id="new-box" class="hidden p-6 lg:p-7 border-b border-slate-100 bg-slate-50/70 space-y-3">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <select id="n-cat" class="py-2.5 px-3 rounded-xl border border-slate-200 text-sm bg-white"><option>근태·연차</option><option>모성보호·육아</option><option>복지·포인트</option><option>급여·퇴직금</option><option>인사·평가</option><option>기타</option></select>
        <input id="n-q" class="md:col-span-3 py-2.5 px-3 rounded-xl border border-slate-200 text-sm" placeholder="질문 (예: 청원휴가는 며칠인가요?)">
      </div>
      <textarea id="n-a" rows="5" class="w-full py-2.5 px-3 rounded-xl border border-slate-200 text-sm" placeholder="답변 — 'AI 초안 생성'을 누르면 인사해삐m이 사규 기반 초안을 작성합니다."></textarea>
      <input id="n-b" class="w-full py-2.5 px-3 rounded-xl border border-slate-200 text-sm" placeholder="관련 근거 규정 (예: 취업규칙 제30조)">
      <div class="flex justify-end gap-2">
        <button id="n-ai" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-semibold hover:bg-slate-100"><span class="material-symbols-outlined text-[16px] text-[#E60012]">auto_awesome</span>AI 초안 생성</button>
        <button id="n-save" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#111827] hover:bg-[#E60012] text-white text-xs font-bold"><span class="material-symbols-outlined text-[16px]">save</span>대기 목록에 저장</button>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[860px]">
        <thead><tr class="bg-slate-50 border-b border-slate-200 text-base font-bold text-slate-900">
          <th class="py-4 px-4 w-20 text-center">ID</th><th class="py-4 px-4 w-36">카테고리</th><th class="py-4 px-4">자주 찾는 질문</th>
          <th class="py-4 px-4 w-32 text-center">등록일자</th><th class="py-4 px-4 w-24 text-center">상태</th><th class="py-4 pl-4 pr-6 w-40 text-center">관리</th></tr></thead>
        <tbody id="rows" class="divide-y divide-slate-200 text-sm"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
if (HR.guard(true)) {
  HR.layout('/faq-admin.html');
  let all = [], open = null, editing = null;
  const statusBadge = (s) => ({ 게시: 'bg-emerald-50 text-emerald-700 border-emerald-200', 반려: 'bg-slate-100 text-slate-500 border-slate-200', 대기: 'bg-amber-50 text-amber-700 border-amber-200' }[s] || 'bg-slate-100');

  HR.api('/api/stats').then((s) => (document.getElementById('stats').innerHTML = HR.statBars(s.topics)));
  const REG_SHOW = 4;
  let regsOpen = false;
  HR.api('/api/regulations').then((rs) => {
    const box = document.getElementById('regs'), tg = document.getElementById('regs-toggle');
    const paint = () => {
      box.querySelectorAll('[data-reg]').forEach((el, i) => el.classList.toggle('hidden', !regsOpen && i >= REG_SHOW));
      tg.innerHTML = regsOpen ? '접기<span class="material-symbols-outlined text-[18px]">expand_less</span>' : `전체 규정 보기 (${rs.length}개)<span class="material-symbols-outlined text-[18px]">expand_more</span>`;
    };
    tg.classList.toggle('hidden', rs.length <= REG_SHOW);
    tg.onclick = () => { regsOpen = !regsOpen; paint(); };
    box.innerHTML = rs.map((r) => `
      <div data-reg class="p-4 rounded-xl border border-slate-200 hover:border-red-200 bg-slate-50/50 hover:bg-white transition-all flex flex-col justify-between gap-3 group">
        <div class="flex items-start justify-between"><div class="space-y-1.5"><h3 class="text-base font-bold text-slate-900 group-hover:text-[#E60012]">${HR.esc(r.name)}</h3><p class="text-xs text-slate-500 font-medium">${HR.esc(r.revised.replace(/-/g, '.'))} 개정</p></div>
          <span class="material-symbols-outlined text-slate-400 group-hover:text-[#E60012] text-[22px]">description</span></div>
        <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between"><span class="text-xs text-slate-600 font-medium">${HR.esc(r.desc)}</span>
          <a class="text-xs font-bold text-slate-800 group-hover:text-[#E60012] inline-flex items-center gap-1" href="/chat.html?q=${encodeURIComponent(r.ask)}">요약 보기<span class="material-symbols-outlined text-[16px]">arrow_forward</span></a></div>
      </div>`).join('');
    paint();
  });

  function render() {
    const kw = document.getElementById('kw').value.trim(), st = document.getElementById('flt').value;
    const list = all.filter((f) => (!st || f.status === st) && (!kw || (f.question + f.answer).includes(kw)));
    document.getElementById('rows').innerHTML = list.map((f) => {
      const on = f.id === open, ed = f.id === editing;
      return `<tr class="hover:bg-slate-50/70 cursor-pointer group ${on ? 'bg-slate-50/40' : ''}" data-open="${f.id}">
        <td class="py-4 px-4 text-center font-semibold text-slate-500 text-xs">${f.id}</td>
        <td class="py-4 px-4"><span class="inline-flex px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200">${HR.esc(f.category)}</span></td>
        <td class="py-4 px-4"><div class="flex items-center gap-2 justify-between"><span class="text-base md:text-lg font-semibold text-slate-900 group-hover:text-[#E60012] leading-snug">${HR.esc(f.question)}</span>
          <span class="material-symbols-outlined text-[18px] ${on ? 'rotate-180 text-[#E60012]' : 'text-slate-400'} transition-transform">keyboard_arrow_down</span></div></td>
        <td class="py-4 px-4 text-center text-xs text-slate-500 font-medium">${HR.esc((f.createdAt || '').replace(/-/g, '.'))}</td>
        <td class="py-4 px-4 text-center"><span class="inline-flex px-2.5 py-1 rounded-md text-xs font-bold border ${statusBadge(f.status)}">${f.status}</span></td>
        <td class="py-4 pl-4 pr-6 text-center" onclick="event.stopPropagation()"><div class="flex items-center justify-center gap-1.5">
          <button data-st="게시" data-id="${f.id}" class="px-2.5 py-1 rounded-md ${f.status === '게시' ? 'bg-slate-100 text-slate-400' : 'bg-[#E60012] hover:bg-[#B7000C] text-white'} text-xs font-bold">게시</button>
          <button data-st="반려" data-id="${f.id}" class="px-2.5 py-1 rounded-md border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-medium">반려</button></div></td>
      </tr>
      ${on ? `<tr><td colspan="6" class="p-0 bg-slate-50/70 border-b border-slate-200"><div class="p-5 md:p-8"><div class="bg-white rounded-xl border border-slate-200 p-6 space-y-5">
        <div class="space-y-3"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[#E60012] text-[20px]">auto_awesome</span><span class="font-bold text-slate-900 text-base">인사해삐 AI 답변 초안</span></div>
          ${ed ? `<textarea id="e-a" rows="7" class="w-full p-4 rounded-xl border border-slate-300 text-sm">${HR.esc(f.answer)}</textarea>`
               : `<div class="md p-5 rounded-xl bg-slate-50/70 border border-slate-200 text-slate-800 text-base">${HR.md(f.answer)}</div>`}</div>
        <div class="flex items-start gap-4 p-5 rounded-xl bg-blue-50/70 border border-blue-100 text-blue-900"><span class="material-symbols-outlined text-blue-600 text-[26px] shrink-0">policy</span>
          <div class="space-y-1.5 flex-1"><span class="font-bold text-blue-950 text-base">법적·규정 근거</span>
          ${ed ? `<input id="e-b" class="w-full p-2 rounded-lg border border-blue-200 text-sm bg-white" value="${HR.esc(f.basis)}">` : `<p class="text-base font-medium">${HR.esc(f.basis || '-')}</p>`}</div></div>
        <div class="pt-3 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100">
          <span class="text-xs text-slate-400">${f.updatedAt ? '최근 수정: ' + HR.esc(f.updatedAt) : '등록: ' + HR.esc(f.createdAt)}${f.sample ? ' · 샘플 데이터' : ''}</span>
          <div class="flex items-center gap-2">
            ${ed ? `<button data-save="${f.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#111827] text-white text-xs font-bold"><span class="material-symbols-outlined text-[16px]">save</span>저장</button>`
                 : `<button data-edit="${f.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold"><span class="material-symbols-outlined text-[16px]">edit</span>답변 수정</button>`}
            <button data-st="반려" data-id="${f.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-semibold"><span class="material-symbols-outlined text-[16px]">close</span>반려</button>
            <button data-st="게시" data-id="${f.id}" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-[#E60012] hover:bg-[#B7000C] text-white text-xs font-bold"><span class="material-symbols-outlined text-[16px]">check</span>게시</button>
          </div></div>
      </div></div></td></tr>` : ''}`;
    }).join('') || '<tr><td colspan="6" class="py-12 text-center text-slate-400">항목이 없습니다.</td></tr>';

    document.querySelectorAll('[data-open]').forEach((r) => (r.onclick = () => { open = open === r.dataset.open ? null : r.dataset.open; editing = null; render(); }));
    document.querySelectorAll('[data-st]').forEach((b) => (b.onclick = async (e) => { e.stopPropagation(); await patch(b.dataset.id, { status: b.dataset.st }); HR.toast(`${b.dataset.st} 처리했습니다.`); }));
    document.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => { editing = b.dataset.edit; render(); }));
    document.querySelectorAll('[data-save]').forEach((b) => (b.onclick = async () => { await patch(b.dataset.save, { answer: document.getElementById('e-a').value, basis: document.getElementById('e-b').value }); editing = null; render(); HR.toast('저장했습니다.'); }));
  }
  async function patch(id, body) { const u = await HR.api('/api/faq/' + id, { method: 'PATCH', body }); all = all.map((f) => (f.id === id ? u : f)); render(); }

  document.getElementById('kw').oninput = render;
  document.getElementById('flt').onchange = render;
  document.getElementById('btn-new').onclick = () => document.getElementById('new-box').classList.toggle('hidden');
  document.getElementById('n-ai').onclick = async (e) => {
    const q = document.getElementById('n-q').value.trim(); if (!q) return HR.toast('질문을 먼저 입력하세요.');
    const btn = e.currentTarget; btn.disabled = true; btn.lastChild.textContent = '작성 중…';
    try {
      const r = await HR.api('/api/chat', { method: 'POST', body: { role: 'admin', sessionId: 'faq-draft', message: `다음 직원 질문에 대한 FAQ 답변 초안을 사규 근거와 함께 간결하게 작성해줘: ${q}` } });
      document.getElementById('n-a').value = r.answer;
    } catch (err) { HR.toast(err.message); }
    btn.disabled = false; btn.lastChild.textContent = 'AI 초안 생성';
  };
  document.getElementById('n-save').onclick = async () => {
    const body = { category: document.getElementById('n-cat').value, question: document.getElementById('n-q').value.trim(), answer: document.getElementById('n-a').value.trim(), basis: document.getElementById('n-b').value.trim() };
    if (!body.question || !body.answer) return HR.toast('질문과 답변을 입력하세요.');
    const item = await HR.api('/api/faq', { method: 'POST', body });
    all.unshift(item); open = item.id; render();
    ['n-q', 'n-a', 'n-b'].forEach((i) => (document.getElementById(i).value = ''));
    document.getElementById('new-box').classList.add('hidden'); HR.toast('대기 목록에 추가했습니다.');
  };
  HR.api('/api/faq').then((d) => { all = d; render(); });
}
</script>
</body></html>
