<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/pretendard/pretendard.css">
<link rel="stylesheet" href="/vendor/symbols/outlined.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/tailwind/index.global.js"></script>
<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/purify.min.js"></script>
<script src="/js/common.js"></script>

<title>KT IS 인사해삐 - HR Happy AI 로그인</title>
</head>
<body class="min-h-screen bg-[#F7F9FB] text-slate-900 flex flex-col relative overflow-x-hidden">
<div class="fixed inset-0 pointer-events-none z-0 flex items-center justify-center overflow-hidden">
  <img src="/img/wave.svg" alt="" class="w-full min-w-[1200px] h-[70vh] opacity-90 select-none -translate-y-6">
</div>
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-10 w-full max-w-xl mx-auto">
  <div class="bg-white rounded-3xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.07),0_4px_16px_-4px_rgba(0,0,0,0.04)] border border-slate-300 px-8 sm:px-11 py-12 sm:py-14 w-full max-w-[460px]">
    <form id="login" class="space-y-6">
      <div class="flex flex-col items-center justify-center pb-3 text-center select-none">
        <div id="logo" class="mb-2"></div>
        <h1 class="text-[24px] sm:text-[28px] font-bold text-slate-800 tracking-tight">HR Happy AI</h1>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-900 mb-2" for="uid">아이디</label>
        <input id="uid" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:border-[#e60012] focus:ring-2 focus:ring-[#e60012]/15" placeholder="아이디를 입력해 주세요" autocomplete="username">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-900 mb-2" for="pw">비밀번호</label>
        <input id="pw" type="password" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm placeholder-slate-400 focus:outline-none focus:border-[#e60012] focus:ring-2 focus:ring-[#e60012]/15" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password">
      </div>
      <div class="flex items-center justify-between pt-0.5 text-xs">
        <label class="flex items-center gap-2 cursor-pointer text-slate-800 font-medium"><input id="keep" type="checkbox" checked class="w-4 h-4 accent-[#e60012]">로그인 유지</label>
        <div class="flex items-center gap-2 text-slate-500"><a href="#" class="hover:text-slate-900">비밀번호 변경</a><span class="text-slate-300">|</span><a href="#" class="hover:text-slate-900">비밀번호 찾기</a></div>
      </div>
      <p id="login-err" role="alert" class="hidden -mt-2 text-xs font-semibold text-[#e60012]"></p>
      <button class="w-full py-3.5 rounded-xl bg-[#e60012] hover:bg-[#d00010] active:scale-[0.99] text-white font-bold text-base shadow-sm hover:shadow-md transition-all">로그인</button>
      <div class="pt-5 border-t border-slate-100">
        <div class="grid grid-cols-2 gap-3" id="roles">
          <button type="button" data-role="employee" class="role-tab flex items-center justify-center gap-2.5 p-2.5 rounded-2xl border transition-all">
            <img src="/img/chars/rabbit.webp" alt="" class="w-11 h-11 object-contain"><span class="text-sm font-semibold">직원용</span></button>
          <button type="button" data-role="admin" class="role-tab flex items-center justify-center gap-2.5 p-2.5 rounded-2xl border transition-all">
            <img src="/img/chars/rabbit-m.webp" alt="" class="w-11 h-11 object-contain"><span class="text-sm font-semibold">인사담당자용</span></button>
        </div>
        <p class="text-[11px] text-slate-400 text-center mt-4">해커톤 시연용 로그인입니다. 사내 SSO 연동 시 역할이 자동 지정됩니다.</p>

      </div>
    </form>
  </div>
</main>
<footer class="relative z-20 w-full bg-white/95 border-t border-slate-200/80 py-6">
  <div class="max-w-[1600px] mx-auto px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-3 text-xs">
    <span class="font-bold text-slate-700">KT IS 인사해삐 (HR Happy AI) 노무·인사 지원 포털</span>
    <span class="text-slate-400">© 2026 KT IS Corp. All rights reserved.</span>
  </div>
</footer>
<script>
  document.getElementById('logo').innerHTML = HR.logo('h-11 sm:h-12');
  let role = 'employee';
  const tabs = document.querySelectorAll('.role-tab');
  function paint() {
    tabs.forEach((t) => {
      const on = t.dataset.role === role;
      t.className = 'role-tab flex items-center justify-center gap-2.5 p-2.5 rounded-2xl transition-all ' +
        (on ? 'border-2 border-red-500/70 bg-red-50/30' : 'border border-slate-200 bg-white hover:bg-slate-50');
      t.querySelector('span').className = 'text-sm ' + (on ? 'font-bold text-slate-900' : 'font-semibold text-slate-600');
    });
  }
  tabs.forEach((t) => t.addEventListener('click', () => { role = t.dataset.role; paint(); }));
  paint();
  // 아이디·비밀번호 로그인 → 계정에 지정된 역할(직원/담당자)로 접속
  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('login-err');
    err.classList.add('hidden');
    try {
      const p = await HR.api('/api/login', { method: 'POST', body: { id: document.getElementById('uid').value, password: document.getElementById('pw').value } });
      if (p.role !== role) { role = p.role; paint(); }
      HR.login(p.role, p.name, { keep: document.getElementById('keep').checked });
      // 처음 로그인할 때만 페르소나의 캐릭터·최근 질문 주제를 채움 (이후 변경은 유지)
      const ck = `hrhappy.char.${p.role}.${p.name}`, rk = `hrhappy.recentTopics.${p.role}.${p.name}`;
      try {
        if (!localStorage.getItem(ck)) localStorage.setItem(ck, p.char);
        if (!localStorage.getItem(rk)) localStorage.setItem(rk, JSON.stringify(p.recentTopics || []));
      } catch {}
      location.href = '/chat.html';
    } catch (ex) {
      err.textContent = ex.message; err.classList.remove('hidden');
      document.getElementById('pw').select();
    }
  });
</script>
</body></html>
